<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140913" />
      <stop offset="100%" stop-color="#0d050c" />
    </linearGradient>
    <linearGradient id="matchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(157, 44, 179, 0.25)" />
      <stop offset="100%" stop-color="rgba(255, 0, 122, 0.12)" />
    </linearGradient>
    <linearGradient id="botOnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- App Window Background -->
  <rect width="800" height="500" fill="url(#bgGrad3)" rx="14" />
  <rect x="1" y="1" width="798" height="498" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" rx="13" />

  <!-- Window Header / Title Bar -->
  <rect x="0" y="0" width="800" height="52" fill="#10060f" rx="14" />
  <rect x="0" y="40" width="800" height="12" fill="#10060f" />
  <line x1="0" y1="52" x2="800" y2="52" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="28" cy="26" r="6" fill="#f87171" opacity="0.9" />
  <circle cx="48" cy="26" r="6" fill="#fbbf24" opacity="0.9" />
  <circle cx="68" cy="26" r="6" fill="#4ade80" opacity="0.9" />

  <!-- Title & Status -->
  <text x="400" y="32" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5" text-anchor="middle">STREAMER LIVE QUEUE MANAGER (NATIVE CHAT BOT)</text>
  
  <rect x="630" y="16" width="146" height="20" fill="rgba(239, 68, 68, 0.15)" stroke="rgba(239, 68, 68, 0.4)" rx="10" />
  <circle cx="642" cy="26" r="3.5" fill="#ef4444" />
  <text x="708" y="30" fill="#f87171" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">LIVE: 5 IN QUEUE</text>

  <!-- Top Controls Bar -->
  <g transform="translate(24, 66)">
    <rect width="752" height="48" fill="#170c16" rx="8" />
    <rect width="752" height="48" fill="none" stroke="rgba(255, 255, 255, 0.06)" rx="8" />
    
    <!-- Bot Switch Status -->
    <rect x="16" y="12" width="120" height="24" fill="url(#botOnGrad)" rx="12" />
    <circle cx="28" cy="24" r="5" fill="#ffffff" />
    <text x="74" y="28" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">BOT ACTIVE</text>

    <!-- Settings tags -->
    <text x="156" y="29" fill="#a295a1" font-family="-apple-system, sans-serif" font-size="12">Chat command: <tspan fill="#33f1e5" font-weight="700">!join</tspan> to queue | <tspan fill="#33f1e5" font-weight="700">!queue</tspan> to view positions</text>
    
    <rect x="620" y="12" width="118" height="24" fill="rgba(157, 44, 179, 0.15)" stroke="rgba(157, 44, 179, 0.3)" rx="6" />
    <text x="679" y="28" fill="#d880f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Auto-Promo: 10m</text>
  </g>

  <!-- Left Column: Current Match Spotlight (330px width) -->
  <g transform="translate(24, 126)">
    <rect width="330" height="274" fill="url(#matchGrad)" stroke="rgba(157, 44, 179, 0.35)" stroke-width="1.5" rx="10" />
    
    <!-- Match Header -->
    <rect x="14" y="14" width="302" height="24" fill="rgba(0, 0, 0, 0.3)" rx="4" />
    <circle cx="26" cy="26" r="3.5" fill="#4ade80" />
    <text x="36" y="30" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">CURRENT MATCH (FT3 SERIES)</text>
    <text x="306" y="30" fill="#33f1e5" font-family="'Space Grotesk', monospace" font-size="11" font-weight="700" text-anchor="end">06:42</text>

    <!-- Player 1 (Streamer) -->
    <rect x="14" y="48" width="302" height="52" fill="rgba(0, 0, 0, 0.25)" rx="6" />
    <text x="26" y="72" fill="#33f1e5" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Streamer (You)</text>
    <rect x="26" y="78" width="56" height="14" fill="#33f1e5" rx="3" />
    <text x="54" y="89" fill="#0d050c" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="800" text-anchor="middle">RANK S</text>
    <text x="296" y="80" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="28" font-weight="700" text-anchor="end">2</text>

    <!-- VS Divider -->
    <text x="165" y="116" fill="#8d7f8c" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="middle">VS</text>

    <!-- Player 2 (Challenger) -->
    <rect x="14" y="126" width="302" height="52" fill="rgba(0, 0, 0, 0.25)" rx="6" />
    <text x="26" y="150" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">KOF_Master</text>
    <rect x="26" y="156" width="60" height="14" fill="#ff007a" rx="3" />
    <text x="56" y="167" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="800" text-anchor="middle">RANK A (1820)</text>
    <text x="296" y="158" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="28" font-weight="700" text-anchor="end">1</text>

    <!-- Match Point Alert -->
    <rect x="14" y="188" width="302" height="28" fill="rgba(51, 241, 229, 0.1)" stroke="rgba(51, 241, 229, 0.25)" rx="4" />
    <text x="165" y="206" fill="#33f1e5" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🔥 MATCH POINT FOR STREAMER</text>

    <!-- Quick Action Buttons -->
    <rect x="14" y="226" width="146" height="34" fill="#ff007a" rx="6" />
    <text x="87" y="247" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⏩ Call Next</text>

    <rect x="170" y="226" width="146" height="34" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" rx="6" />
    <text x="243" y="247" fill="#a295a1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🔄 Reset Series</text>
  </g>

  <!-- Right Column: Waiting Queue (410px width) -->
  <g transform="translate(366, 126)">
    <rect width="410" height="274" fill="#170c16" rx="10" />
    <rect width="410" height="274" fill="none" stroke="rgba(255, 255, 255, 0.06)" rx="10" />

    <!-- Queue Header -->
    <text x="16" y="26" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Challenger Queue (First-Come, First-Served)</text>
    <text x="394" y="26" fill="#33f1e5" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="end">4 Waiting</text>

    <!-- Queue Row 1 (Next Up) -->
    <g transform="translate(14, 40)">
      <rect width="382" height="46" fill="rgba(51, 241, 229, 0.06)" stroke="rgba(51, 241, 229, 0.25)" rx="6" />
      <text x="12" y="27" fill="#33f1e5" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">1st</text>
      <text x="38" y="27" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">NeonStrike</text>
      <text x="140" y="27" fill="#a295a1" font-family="-apple-system, sans-serif" font-size="11">[Rank B | 🇧🇷 18ms]</text>
      <rect x="290" y="11" width="80" height="24" fill="#33f1e5" rx="4" />
      <text x="330" y="27" fill="#0d050c" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">NEXT UP</text>
    </g>

    <!-- Queue Row 2 -->
    <g transform="translate(14, 92)">
      <rect width="382" height="46" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" rx="6" />
      <text x="12" y="27" fill="#8d7f8c" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">2nd</text>
      <text x="38" y="27" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">ShadowFox</text>
      <text x="140" y="27" fill="#a295a1" font-family="-apple-system, sans-serif" font-size="11">[Rank A | 🇨🇱 48ms]</text>
      <rect x="290" y="11" width="80" height="24" fill="rgba(255, 255, 255, 0.05)" rx="4" />
      <text x="330" y="27" fill="#a295a1" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">IN QUEUE</text>
    </g>

    <!-- Queue Row 3 -->
    <g transform="translate(14, 144)">
      <rect width="382" height="46" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)" rx="6" />
      <text x="12" y="27" fill="#8d7f8c" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">3rd</text>
      <text x="38" y="27" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">SolarKnight</text>
      <text x="140" y="27" fill="#a295a1" font-family="-apple-system, sans-serif" font-size="11">[Rank B | 🇦🇷 52ms]</text>
      <rect x="290" y="11" width="80" height="24" fill="rgba(255, 255, 255, 0.05)" rx="4" />
      <text x="330" y="27" fill="#a295a1" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">IN QUEUE</text>
    </g>

    <!-- Add manual player input simulation -->
    <g transform="translate(14, 214)">
      <rect width="270" height="34" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(255, 255, 255, 0.08)" rx="6" />
      <text x="14" y="21" fill="#6e616d" font-family="-apple-system, sans-serif" font-size="11">Enter nickname manually...</text>
      <rect x="280" y="0" width="102" height="34" fill="rgba(157, 44, 179, 0.8)" rx="6" />
      <text x="331" y="21" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">+ Add</text>
    </g>
  </g>

  <!-- Bottom Bar: Chat Bot Notification Mockup -->
  <g transform="translate(24, 414)">
    <rect width="752" height="66" fill="#10060f" stroke="rgba(255, 255, 255, 0.06)" rx="8" />
    <text x="16" y="24" fill="#a295a1" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">AUTOMATED CHANNEL CHAT BROADCAST:</text>
    <rect x="16" y="34" width="720" height="24" fill="rgba(255, 255, 255, 0.02)" rx="4" />
    <text x="24" y="50" fill="#33f1e5" font-family="'Space Grotesk', monospace" font-size="11" font-weight="700">[Queue Bot]:</text>
    <text x="96" y="50" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11">Match started: <tspan fill="#33f1e5">@Streamer</tspan> vs <tspan fill="#ff007a">@KOF_Master</tspan> (FT3). Next up: <tspan fill="#4ade80">@KenSf3</tspan>. Type !join to challenge.</text>
  </g>
</svg>
