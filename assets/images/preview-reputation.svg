<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140913" />
      <stop offset="100%" stop-color="#0d050c" />
    </linearGradient>
    <linearGradient id="endgameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(51, 241, 229, 0.15)" />
      <stop offset="100%" stop-color="rgba(157, 44, 179, 0.12)" />
    </linearGradient>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- App Window Background -->
  <rect width="800" height="500" fill="url(#bgGrad4)" rx="14" />
  <rect x="1" y="1" width="798" height="498" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" rx="13" />

  <!-- Window Header / Title Bar -->
  <rect x="0" y="0" width="800" height="52" fill="#10060f" rx="14" />
  <rect x="0" y="40" width="800" height="12" fill="#10060f" />
  <line x1="0" y1="52" x2="800" y2="52" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="28" cy="26" r="6" fill="#f87171" opacity="0.9" />
  <circle cx="48" cy="26" r="6" fill="#fbbf24" opacity="0.9" />
  <circle cx="68" cy="26" r="6" fill="#4ade80" opacity="0.9" />

  <!-- Title & Status -->
  <text x="400" y="32" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5" text-anchor="middle">PLAYER REPUTATION &amp; ENDGAME RECAP</text>
  
  <rect x="630" y="16" width="146" height="20" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" rx="10" />
  <circle cx="644" cy="26" r="3.5" fill="#10b981" />
  <text x="710" y="30" fill="#10b981" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">PROTECTION ACTIVE</text>

  <!-- Top Feature: In-Chat Endgame Recap Card -->
  <g transform="translate(24, 66)">
    <rect width="752" height="150" fill="url(#endgameGrad)" stroke="rgba(51, 241, 229, 0.3)" stroke-width="1.5" rx="10" />
    
    <!-- Recap Header -->
    <rect x="16" y="12" width="720" height="26" fill="rgba(0, 0, 0, 0.3)" rx="4" />
    <text x="28" y="29" fill="#33f1e5" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">🏆 ENDGAME SUMMARY: FT5 SERIES COMPLETED</text>
    <text x="724" y="29" fill="#a295a1" font-family="'Space Grotesk', monospace" font-size="11" text-anchor="end">Duration: 14m 28s</text>

    <!-- Scoreboards -->
    <g transform="translate(16, 46)">
      <!-- Winner (FightcadePlus) -->
      <rect width="350" height="58" fill="rgba(0, 0, 0, 0.25)" rx="6" />
      <text x="14" y="26" fill="#33f1e5" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">FightcadePlus (Winner)</text>
      <rect x="14" y="33" width="54" height="15" fill="#33f1e5" rx="3" />
      <text x="41" y="44" fill="#0d050c" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="800" text-anchor="middle">RANK A</text>
      
      <text x="270" y="34" fill="#4ade80" font-family="'Space Grotesk', monospace" font-size="13" font-weight="700">+24 pts ▲</text>
      <text x="270" y="48" fill="#8d7f8c" font-family="'Space Grotesk', monospace" font-size="10">1869 Elo</text>
      <text x="336" y="40" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="28" font-weight="700" text-anchor="end">5</text>

      <!-- Loser (FriendlyRival) -->
      <g transform="translate(370, 0)">
        <rect width="350" height="58" fill="rgba(0, 0, 0, 0.25)" rx="6" />
        <text x="14" y="26" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">FriendlyRival</text>
        <rect x="14" y="33" width="54" height="15" fill="#a855f7" rx="3" />
        <text x="41" y="44" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="800" text-anchor="middle">RANK B</text>

        <text x="270" y="34" fill="#f87171" font-family="'Space Grotesk', monospace" font-size="13" font-weight="700">-18 pts ▼</text>
        <text x="270" y="48" fill="#8d7f8c" font-family="'Space Grotesk', monospace" font-size="10">1722 Elo</text>
        <text x="336" y="40" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="28" font-weight="700" text-anchor="end">3</text>
      </g>
    </g>

    <!-- Fair play footer badge inside card -->
    <rect x="16" y="112" width="720" height="26" fill="rgba(255, 255, 255, 0.03)" rx="4" />
    <text x="28" y="129" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">✓ Ranked match validated. Fair play recorded (no rage-quits or early cable disconnects).</text>
  </g>

  <!-- In-Chat Reputation Elements -->
  <g transform="translate(24, 226)">
    <rect width="752" height="214" fill="#170c16" rx="10" />
    <rect width="752" height="214" fill="none" stroke="rgba(255, 255, 255, 0.06)" rx="10" />

    <!-- Chat Header -->
    <text x="16" y="24" fill="#a295a1" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">ROOM CHAT &amp; REPUTATION HIGHLIGHTS</text>

    <!-- Message 1: Positive Rival (Glowing emerald border & badge) -->
    <g transform="translate(14, 34)">
      <rect width="724" height="48" fill="rgba(74, 222, 128, 0.05)" stroke="rgba(74, 222, 128, 0.25)" stroke-width="1" rx="6" />
      <circle cx="20" cy="24" r="10" fill="#2d162b" />
      <text x="20" y="28" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">F</text>
      <text x="38" y="28" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">FriendlyRival</text>
      <text x="122" y="28" fill="#8d7f8c" font-family="-apple-system, sans-serif" font-size="11">[Rank B | 🇧🇷]:</text>
      <text x="200" y="28" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12">"Ggs! Amazing match, let's play FT10 next time!"</text>
      
      <!-- Favorite Badge -->
      <rect x="626" y="13" width="86" height="22" fill="url(#favGrad)" rx="4" />
      <text x="669" y="28" fill="#0d050c" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">★ FAVORITE</text>
    </g>

    <!-- Message 2: Toxic Player (Dimmed & Silenced) -->
    <g transform="translate(14, 88)" opacity="0.5">
      <rect width="724" height="48" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(248, 113, 113, 0.2)" stroke-dasharray="4 2" rx="6" />
      <circle cx="20" cy="24" r="10" fill="#1b0e1a" />
      <text x="20" y="28" fill="#8d7f8c" font-family="'Space Grotesk', sans-serif" font-size="10" text-anchor="middle">T</text>
      <text x="38" y="28" fill="#f87171" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" style="text-decoration: line-through;">ToxicPlayer_99</text>
      <text x="140" y="28" fill="#8d7f8c" font-family="-apple-system, sans-serif" font-size="11">[Rank D | 🇺🇸]:</text>
      <text x="215" y="28" fill="#8d7f8c" font-family="-apple-system, sans-serif" font-size="12" font-style="italic">[Message silenced by Reputation Filter]</text>
      
      <!-- Downvoted Badge -->
      <rect x="612" y="13" width="100" height="22" fill="rgba(248, 113, 113, 0.2)" stroke="rgba(248, 113, 113, 0.4)" rx="4" />
      <text x="662" y="28" fill="#f87171" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">DOWNVOTED</text>
    </g>

    <!-- Message 3: System Auto-Reject Notice -->
    <g transform="translate(14, 142)">
      <rect width="724" height="48" fill="rgba(255, 0, 122, 0.06)" stroke="rgba(255, 0, 122, 0.25)" rx="6" />
      <text x="16" y="28" fill="#ff007a" font-family="'Space Grotesk', monospace" font-size="12" font-weight="700">[FightcadePlus Shield]:</text>
      <text x="144" y="28" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12">Incoming challenge from <tspan fill="#f87171" font-weight="600">'ToxicPlayer_99'</tspan> automatically rejected (Reason: Downvoted Troll).</text>
      
      <rect x="626" y="13" width="86" height="22" fill="rgba(255, 0, 122, 0.2)" rx="4" />
      <text x="669" y="28" fill="#ff007a" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">BLOCKED</text>
    </g>
  </g>

  <!-- Bottom Bar: Status Info -->
  <g transform="translate(24, 452)">
    <circle cx="10" cy="14" r="4" fill="#4ade80" />
    <text x="22" y="18" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Quick Reputation Actions:</text>
    <text x="175" y="18" fill="#a295a1" font-family="-apple-system, sans-serif" font-size="11">1-click favorite or mute directly via chat nickname and player list context menu.</text>
    <text x="750" y="18" fill="#33f1e5" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="end">Auto-Reject Shield: Active</text>
  </g>
</svg>
